<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Noise Tracker sound fixture</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312324A'/%3E%3C/svg%3E">
</head>
<body>
  <h1>Local sound fixture</h1>
  <p>This page plays a tone in the browser. It does not load anything from the network. Serve it over http, play the tone, and the tab icon should pulse in your alert colour, then return to this blue mark. The page itself stays plain unless you turn the on-page flash on.</p>
  <button id="play" type="button">Play tone</button>
  <button id="stop" type="button">Stop tone</button>
  <script>
    let context = null;
    let oscillator = null;
    document.getElementById('play').addEventListener('click', function () {
      if (!context) context = new AudioContext();
      if (oscillator) return;
      oscillator = context.createOscillator();
      oscillator.frequency.value = 440;
      oscillator.connect(context.destination);
      oscillator.start();
    });
    document.getElementById('stop').addEventListener('click', function () {
      if (!oscillator) return;
      oscillator.stop();
      oscillator.disconnect();
      oscillator = null;
    });
  </script>
</body>
</html>
