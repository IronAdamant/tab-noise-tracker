<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Noise Tracker sound fixture</title>
</head>
<body>
  <h1>Local sound fixture</h1>
  <p>This page plays a tone in the browser. It does not load anything from the network.</p>
  <button id="play" type="button">Play tone</button>
  <button id="stop" type="button">Stop tone</button>
  <script>
    let context = null;
    let oscillator = null;
    document.getElementById('play').addEventListener('click', function () {
      if (!context) context = new AudioContext();
      if (oscillator) return;
      oscillator = context.createOscillator();
      oscillator.frequency.value = 440;
      oscillator.connect(context.destination);
      oscillator.start();
    });
    document.getElementById('stop').addEventListener('click', function () {
      if (!oscillator) return;
      oscillator.stop();
      oscillator.disconnect();
      oscillator = null;
    });
  </script>
</body>
</html>
